<!DOCTYPE html>
<html lang="pt-br">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
   <title>
    Central Denúncias Wa
   </title>
   <link href="https://fonts.googleapis.com" rel="preconnect"/>
   <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&amp;family=Share+Tech+Mono&amp;display=swap" rel="stylesheet"/>
   <style>
    * {
    margin:0;
    padding:0;
    box-sizing:border-box;
}
 body {
    font-family:'Orbitron',sans-serif;
    background:#000;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    overflow:hidden;
}
 body::after {
    content:"";
    position:fixed;
    inset:0;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.18) 2px,rgba(0,0,0,0.18) 4px);
    pointer-events:none;
    z-index:9999;
}
 .bg-grid {
    position:fixed;
    inset:0;
    background:linear-gradient(rgba(255,0,0,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,0,0,0.06) 1px,transparent 1px);
    background-size:50px 50px;
    animation:gridMove 20s linear infinite;
}
 @keyframes gridMove {
    0% {
    background-position:0 0;
}
100% {
    background-position:50px 50px;
}
}
 .bg-glow {
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse 60% 50% at 50% 50%,rgba(180,0,0,0.18) 0%,transparent 70%);
    pointer-events:none;
}
 .particles {
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}
 .particles span {
    position:absolute;
    bottom:-10px;
    border-radius:50%;
    background:radial-gradient(circle,#ff4444,#ff0000);
    box-shadow:0 0 8px #ff0000,0 0 20px #ff000088;
    animation:rise linear infinite;
    opacity:0;
}
 @keyframes rise {
    0% {
    transform:translateY(0) scale(0.5);
    opacity:0;
}
10% {
    opacity:0.9;
}
90% {
    opacity:0.4;
}
100% {
    transform:translateY(-110vh) scale(1.2);
    opacity:0;
}
}
 .lightning {
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}
 .lightning span {
    position:absolute;
    width:2px;
    background:linear-gradient(to bottom,transparent,#ff2222,#fff,#ff2222,transparent);
    box-shadow:0 0 10px #ff0000,0 0 30px #ff000099,0 0 60px #ff000044;
    opacity:0;
    animation:flash linear infinite;
}
 @keyframes flash {
    0%,90%,100% {
    opacity:0;
    transform:scaleY(0.8);
}
3%,6% {
    opacity:1;
    transform:scaleY(1);
}
4.5% {
    opacity:0.4;
    transform:scaleY(1.05);
}
}
 .corner {
    position:fixed;
    width:80px;
    height:80px;
    pointer-events:none;
}
 .corner::before,.corner::after {
    content:"";
    position:absolute;
    background:#ff0000;
    box-shadow:0 0 8px #ff0000;
}
 .corner::before {
    width:2px;
    height:100%;
}
 .corner::after {
    width:100%;
    height:2px;
}
 .corner.tl {
    top:20px;
    left:20px;
}
.corner.tl::before {
    top:0;
    left:0;
}
.corner.tl::after {
    top:0;
    left:0;
}
 .corner.tr {
    top:20px;
    right:20px;
    transform:scaleX(-1);
}
.corner.tr::before {
    top:0;
    left:0;
}
.corner.tr::after {
    top:0;
    left:0;
}
 .corner.bl {
    bottom:20px;
    left:20px;
    transform:scaleY(-1);
}
.corner.bl::before {
    top:0;
    left:0;
}
.corner.bl::after {
    top:0;
    left:0;
}
 .corner.br {
    bottom:20px;
    right:20px;
    transform:scale(-1);
}
.corner.br::before {
    top:0;
    left:0;
}
.corner.br::after {
    top:0;
    left:0;
}
 .ticker {
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:32px;
    background:rgba(100,0,0,0.5);
    border-top:1px solid rgba(255,0,0,0.5);
    overflow:hidden;
    display:flex;
    align-items:center;
    z-index:100;
    backdrop-filter:blur(6px);
}
 .ticker-inner {
    display:flex;
    gap:80px;
    white-space:nowrap;
    animation:ticker 30s linear infinite;
    color:#ff4444;
    font-size:11px;
    letter-spacing:2px;
    font-family:'Share Tech Mono',monospace;
}
 @keyframes ticker {
    0% {
    transform:translateX(0);
}
100% {
    transform:translateX(-50%);
}
}
 .wrap {
    position:relative;
    z-index:10;
    width:100%;
    max-width:460px;
    padding:16px;
}
 .card {
    position:relative;
    padding:44px 40px;
    border-radius:20px;
    background:rgba(4,0,0,0.82);
    border:1px solid rgba(255,0,0,0.35);
    backdrop-filter:blur(20px);
    box-shadow:0 0 0 1px rgba(255,0,0,0.08),0 0 30px rgba(255,0,0,0.35),0 0 80px rgba(255,0,0,0.15),inset 0 0 60px rgba(255,0,0,0.07);
    animation:cardPulse 4s ease-in-out infinite alternate;
    overflow:hidden;
}
 @keyframes cardPulse {
    from {
    box-shadow:0 0 0 1px rgba(255,0,0,0.08),0 0 30px rgba(255,0,0,0.35),0 0 80px rgba(255,0,0,0.15),inset 0 0 60px rgba(255,0,0,0.07);
}
to {
    box-shadow:0 0 0 1px rgba(255,0,0,0.15),0 0 60px rgba(255,0,0,0.6),0 0 120px rgba(255,0,0,0.25),inset 0 0 80px rgba(255,0,0,0.12);
}
}
 .card::before {
    content:"";
    position:absolute;
    top:0;
    left:10%;
    width:80%;
    height:2px;
    background:linear-gradient(90deg,transparent,#ff0000,#ff4444,#ff0000,transparent);
    box-shadow:0 0 12px #ff000099;
}
 .badge {
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:rgba(255,0,0,0.12);
    border:1px solid rgba(255,0,0,0.4);
    border-radius:999px;
    padding:4px 14px;
    font-size:10px;
    color:#ff4444;
    letter-spacing:3px;
    margin-bottom:18px;
}
 .badge-dot {
    width:6px;
    height:6px;
    border-radius:50%;
    background:#ff2222;
    box-shadow:0 0 6px #ff0000;
    animation:blink 1.2s ease-in-out infinite;
}
 @keyframes blink {
    0%,100% {
    opacity:1;
}
50% {
    opacity:0.2;
}
}
 .logo {
    text-align:center;
    margin-bottom:36px;
}
 .logo-title {
    font-size:38px;
    font-weight:900;
    letter-spacing:6px;
    color:#fff;
    text-shadow:0 0 10px #ff0000,0 0 30px #ff0000,0 0 70px #ff000088;
    line-height:1;
    position:relative;
    display:inline-block;
    animation:glitch 6s infinite;
}
 .logo-title::after {
    content:attr(data-text);
    position:absolute;
    left:2px;
    top:2px;
    color:#ff2222;
    opacity:0.4;
    filter:blur(2px);
    z-index:-1;
}
 @keyframes glitch {
    0%,90%,100% {
    text-shadow:0 0 10px #ff0000,0 0 30px #ff0000,0 0 70px #ff000088;
}
92% {
    text-shadow:-3px 0 #0ff,3px 0 #f0f,0 0 30px #ff0000;
}
94% {
    text-shadow:3px 0 #0ff,-3px 0 #f0f,0 0 30px #ff0000;
}
96% {
    text-shadow:-3px 0 #0ff,3px 0 #f0f,0 0 30px #ff0000;
}
98% {
    text-shadow:0 0 10px #ff0000,0 0 30px #ff0000,0 0 70px #ff000088;
}
}
 .logo-sub {
    margin-top:10px;
    color:#666;
    font-size:11px;
    letter-spacing:4px;
    font-family:'Share Tech Mono',monospace;
}
 .divider {
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,0,0,0.5),transparent);
    margin:0 0 28px;
}
 .inputBox {
    margin-bottom:20px;
    position:relative;
}
 .inputBox label {
    color:#cc2222;
    font-size:10px;
    letter-spacing:3px;
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:10px;
}
 .inputBox label svg {
    opacity:0.7;
}
 .inputBox input,.inputBox select {
    width:100%;
    padding:16px 18px;
    border-radius:12px;
    border:1px solid rgba(255,0,0,0.25);
    background:rgba(10,0,0,0.7);
    color:#fff;
    outline:none;
    transition:all 0.3s;
    font-family:'Orbitron',sans-serif;
    font-size:13px;
    letter-spacing:1px;
}
 .inputBox input::placeholder {
    color:#3a3a3a;
}
 .inputBox input:focus,.inputBox select:focus {
    border-color:rgba(255,0,0,0.7);
    box-shadow:0 0 0 3px rgba(255,0,0,0.12),0 0 20px rgba(255,0,0,0.3);
    background:rgba(18,0,0,0.85);
}
 .inputBox select option {
    background:#0d0000;
    color:#fff;
}
 .eye-toggle {
    position:absolute;
    right:16px;
    bottom:16px;
    cursor:pointer;
    color:#441111;
    transition:color 0.2s;
}
 .eye-toggle:hover {
    color:#ff3333;
}
 .strength {
    display:flex;
    gap:4px;
    margin-top:8px;
}
 .strength-bar {
    height:3px;
    flex:1;
    border-radius:999px;
    background:rgba(255,0,0,0.1);
    transition:background 0.4s;
}
 .strength-bar.active {
    background:#ff0000;
    box-shadow:0 0 6px #ff000099;
}
 .btn {
    width:100%;
    padding:18px;
    margin-top:10px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#5e0000 0%,#cc0000 50%,#5e0000 100%);
    background-size:200% 200%;
    color:#fff;
    font-family:'Orbitron',sans-serif;
    font-size:15px;
    font-weight:800;
    letter-spacing:5px;
    cursor:pointer;
    transition:transform 0.2s,box-shadow 0.2s;
    animation:btnShift 5s ease infinite;
    box-shadow:0 0 20px rgba(255,0,0,0.5),0 4px 20px rgba(0,0,0,0.6);
    position:relative;
    overflow:hidden;
}
 .btn::after {
    content:"";
    position:absolute;
    top:-50%;
    left:-60%;
    width:40%;
    height:200%;
    background:rgba(255,255,255,0.1);
    transform:rotate(20deg) skewX(-10deg);
    animation:btnShine 5s ease infinite;
}
 @keyframes btnShine {
    0%,40% {
    left:-60%;
}
55%,100% {
    left:130%;
}
}
 @keyframes btnShift {
    0% {
    background-position:0% 50%;
}
50% {
    background-position:100% 50%;
}
100% {
    background-position:0% 50%;
}
}
 .btn:hover {
    transform:translateY(-2px) scale(1.02);
    box-shadow:0 0 40px rgba(255,0,0,0.8),0 8px 30px rgba(0,0,0,0.7);
}
 .btn:active {
    transform:scale(0.98);
}
 .erro {
    color:#ff4444;
    text-align:center;
    margin-top:14px;
    font-size:11px;
    letter-spacing:2px;
    min-height:18px;
    font-family:'Share Tech Mono',monospace;
}
 #loginPage {
    display:block;
}
#painelPage {
    display:none;
}
 .loading {
    margin-top:24px;
    display:none;
    animation:fadeIn 0.3s ease;
}
 @keyframes fadeIn {
    from {
    opacity:0;
    transform:translateY(8px);
}
to {
    opacity:1;
    transform:none;
}
}
 .loadingLabel {
    color:#ff4444;
    font-size:11px;
    letter-spacing:3px;
    text-align:center;
    margin-bottom:12px;
    font-family:'Share Tech Mono',monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
}
 .loadingLabel::before,.loadingLabel::after {
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(to right,transparent,rgba(255,0,0,0.4));
}
 .loadingLabel::after {
    background:linear-gradient(to left,transparent,rgba(255,0,0,0.4));
}
 .bar-wrap {
    position:relative;
    width:100%;
    height:14px;
    background:rgba(255,0,0,0.08);
    border-radius:999px;
    overflow:hidden;
    border:1px solid rgba(255,0,0,0.2);
}
 .bar-fill {
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg,#7a0000,#ff0000,#ff6666,#ff0000,#7a0000);
    background-size:200% 100%;
    box-shadow:0 0 14px #ff0000,0 0 30px rgba(255,0,0,0.6);
    transition:width 0.05s;
}
 .bar-pct {
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    letter-spacing:2px;
    color:rgba(255,200,200,0.85);
    font-family:'Share Tech Mono',monospace;
}
 .bar-steps {
    margin-top:12px;
    font-size:10px;
    color:#441414;
    font-family:'Share Tech Mono',monospace;
    letter-spacing:1px;
    line-height:1.9;
}
 .bar-steps .step {
    display:flex;
    align-items:center;
    gap:8px;
    transition:color 0.3s;
}
 .bar-steps .step.done {
    color:#ff4444;
}
 .bar-steps .step::before {
    content:"○";
    font-size:10px;
    transition:0.3s;
}
 .bar-steps .step.done::before {
    content:"●";
    color:#ff0000;
    text-shadow:0 0 8px #ff0000;
}
 .stats {
    display:flex;
    gap:12px;
    margin-bottom:24px;
}
 .stat-box {
    flex:1;
    border:1px solid rgba(255,0,0,0.2);
    border-radius:12px;
    padding:12px 10px;
    text-align:center;
    background:rgba(20,0,0,0.4);
    position:relative;
    overflow:hidden;
}
 .stat-box::before {
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,0,0,0.5),transparent);
}
 .stat-val {
    font-size:22px;
    font-weight:900;
    color:#ff2222;
    text-shadow:0 0 12px #ff0000;
    line-height:1;
}
 .stat-lbl {
    font-size:8px;
    color:#441111;
    letter-spacing:2px;
    margin-top:5px;
    font-family:'Share Tech Mono',monospace;
}
 .popup {
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(0.8);
    background:rgba(4,0,0,0.96);
    border:1px solid rgba(255,0,0,0.6);
    padding:36px 50px;
    border-radius:20px;
    color:#fff;
    z-index:1000;
    box-shadow:0 0 0 1px rgba(255,0,0,0.1),0 0 40px #ff0000,0 0 100px rgba(255,0,0,0.4);
    opacity:0;
    transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);
    pointer-events:none;
    text-align:center;
    backdrop-filter:blur(20px);
}
 .popup.active {
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    pointer-events:all;
}
 .popup-icon {
    font-size:48px;
    margin-bottom:14px;
    display:block;
    filter:drop-shadow(0 0 12px #ff0000);
}
 .popup-title {
    font-size:18px;
    font-weight:800;
    letter-spacing:4px;
    color:#fff;
    text-shadow:0 0 20px #ff0000;
    margin-bottom:8px;
}
 .popup-sub {
    font-size:11px;
    color:#888;
    letter-spacing:2px;
    font-family:'Share Tech Mono',monospace;
}
 .overlay {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    backdrop-filter:blur(4px);
    z-index:999;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.4s;
}
 .overlay.active {
    opacity:1;
    pointer-events:all;
}
 @media(max-width:520px) {
    .card {
    padding:32px 22px;
}
.logo-title {
    font-size:28px;
    letter-spacing:4px;
}
.stats {
    gap:8px;
}
.stat-val {
    font-size:18px;
}
}
   </style>
  </meta>
 </head>
 <body>
  <div class="bg-grid">
  </div>
  <div class="bg-glow">
  </div>
  <div class="particles" id="particles">
  </div>
  <div class="lightning" id="lightning">
  </div>
  <div class="corner tl">
  </div>
  <div class="corner tr">
  </div>
  <div class="corner bl">
  </div>
  <div class="corner br">
  </div>
  <div class="ticker">
   <div class="ticker-inner" id="ticker-inner">
   </div>
  </div>
  <div class="wrap">
   <div class="card" id="loginPage">
    <div style="text-align:center;margin-bottom:18px;">
     <div class="badge">
      <div class="badge-dot">
      </div>
      SISTEMA ATIVO
     </div>
    </div>
    <div class="logo">
     <div class="logo-title" data-text="LOGIN">
      LOGIN
     </div>
     <div class="logo-sub">
      CENTRAL PRIVADA — ACESSO RESTRITO
     </div>
    </div>
    <div class="divider">
    </div>
    <div class="inputBox">
     <label>
      <svg fill="none" height="12" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="12">
       <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2">
       </path>
       <circle cx="12" cy="7" r="4">
       </circle>
      </svg>
      USUÁRIO
     </label>
     <input autocomplete="off" id="usuario" placeholder="Digite seu usuário" spellcheck="false" type="text"/>
    </div>
    <div class="inputBox" style="position:relative;">
     <label>
      <svg fill="none" height="12" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="12">
       <rect height="11" rx="2" width="18" x="3" y="11">
       </rect>
       <path d="M7 11V7a5 5 0 0 1 10 0v4">
       </path>
      </svg>
      SENHA
     </label>
     <input autocomplete="off" id="senha" oninput="updateStrength(this.value)" placeholder="Digite sua senha" type="password"/>
     <span class="eye-toggle" onclick="toggleEye()">
      <svg fill="none" height="18" id="eyeIcon" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="18">
       <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z">
       </path>
       <circle cx="12" cy="12" r="3">
       </circle>
      </svg>
     </span>
     <div class="strength">
      <div class="strength-bar" id="sb1">
      </div>
      <div class="strength-bar" id="sb2">
      </div>
      <div class="strength-bar" id="sb3">
      </div>
      <div class="strength-bar" id="sb4">
      </div>
     </div>
    </div>
    <button class="btn" onclick="logar()">
     ACESSAR
    </button>
    <div class="erro" id="erro">
    </div>
   </div>
   <div class="card" id="painelPage">
    <div style="text-align:center;margin-bottom:18px;">
     <div class="badge">
      <div class="badge-dot">
      </div>
      CONECTADO
     </div>
    </div>
    <div class="logo">
     <div class="logo-title" data-text="CENTRAL">
      CENTRAL
     </div>
     <div class="logo-sub">
      DENÚNCIAS WA — BAN EM ATÉ 24H
     </div>
    </div>
    <div class="divider">
    </div>
    <div class="stats">
     <div class="stat-box">
      <div class="stat-val" id="statTotal">
       0
      </div>
      <div class="stat-lbl">
       ENVIADOS
      </div>
     </div>
     <div class="stat-box">
      <div class="stat-val" id="statSessao">
       0
      </div>
      <div class="stat-lbl">
       SESSÃO
      </div>
     </div>
     <div class="stat-box">
      <div class="stat-val">
       24H
      </div>
      <div class="stat-lbl">
       TEMPO BAN
      </div>
     </div>
    </div>
    <div class="inputBox">
     <label>
      <svg fill="none" height="12" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="12">
       <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.99 14a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.92 3h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
       </path>
      </svg>
      NÚMERO ALVO
     </label>
     <input id="numero" oninput="formatPhone(this)" placeholder="+55 99 99999-9999" type="text"/>
    </div>
    <div class="inputBox">
     <label>
      <svg fill="none" height="12" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" width="12">
       <polyline points="22 12 18 12 15 21 9 3 6 12 2 12">
       </polyline>
      </svg>
      QUANTIDADE DE DENÚNCIAS
     </label>
     <select id="quantidade">
      <option value="">
       — Selecione —
      </option>
      <option value="1000">
       1.000 denúncias
      </option>
      <option value="2000">

let totalGlobal=parseInt(localStorage.getItem('totalGlobal')||'0');
let sessaoCount=0;

function animateCounter(el,target,duration=1500) {
    const start=parseInt(el.textContent.replace(/\D/g,''))||0;
    const st=performance.now();
    function step(now) {
        const e=now-st;
        const p=Math.min(e/duration,1);
        const ease=1-Math.pow(1-p,3);
        el.textContent=Math.round(start+(target-start)*ease).toLocaleString('pt-BR');
        if(p<1)requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
}
let eyeOpen=false;
function toggleEye() {
    eyeOpen=!eyeOpen;
    const i=document.getElementById('senha');
    i.type=eyeOpen?'text':'password';
    document.getElementById('eyeIcon').innerHTML=eyeOpen?'<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>':'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
}

function formatPhone(inp) {
    let v=inp.value.replace(/\D/g,'');
    if(v.length>2)v='+'+v.slice(0,2)+' '+v.slice(2);
    if(v.length>6)v=v.slice(0,6)+' '+v.slice(6);
    if(v.length>15)v=v.slice(0,15);
    inp.value=v;
}
function logar() {
    const u=document.getElementById('usuario').value.trim();
    const s=document.getElementById('senha').value;
    const e=document.getElementById('erro');
    if(!u||!s) {
        e.textContent='⚠ PREENCHA TODOS OS CAMPOS';
        shake(document.getElementById('loginPage'));
        return;
    }
    if(u==='bjk250'&&s==='bjk250') {
        e.textContent='';
        const l=document.getElementById('loginPage');
        l.style.opacity='0';
        l.style.transform='scale(0.95)';
        l.style.transition='all 0.4s';
        setTimeout(()=> {
            l.style.display='none';
            const p=document.getElementById('painelPage');
            p.style.display='block';
            p.style.opacity='0';
            p.style.transform='scale(1.03)';
            p.style.transition='all 0.4s';
            requestAnimationFrame(()=>requestAnimationFrame(()=> {
                p.style.opacity='1';
                p.style.transform='scale(1)';
            }
            ));
        }
        ,400);
    }
    else {
        e.textContent='⚠ USUÁRIO OU SENHA INCORRETOS';
        shake(document.getElementById('loginPage'));
    }
}
function shake(el) {
    el.style.animation='none';
    el.style.transition='transform 0.05s';
    const seq=[6,-6,5,-5,4,-3,2,-1,0];
    let i=0;
    const t=setInterval(()=> {
        el.style.transform=`translateX(${seq[i]||0}px)`;
        i++;
        if(i>=seq.length) {
            clearInterval(t);
            el.style.transform='';
            el.style.animation='cardPulse 4s ease-in-out infinite alternate';
        }
    }
    ,50);
}
function enviar() {
    const n=document.getElementById('numero').value.trim();
    const q=document.getElementById('quantidade').value;
    if(!n||!q)return;
    const btn=document.getElementById('btnEnviar');
    btn.disabled=true;
    btn.style.opacity='0.5';
    const loading=document.getElementById('loading');
    const bf=document.getElementById('barFill');
    const bp=document.getElementById('barPct');
    const steps=[document.getElementById('step1'),document.getElementById('step2'),document.getElementById('step3'),document.getElementById('step4')];
    bf.style.animation='none';
    bf.style.width='0%';
    steps.forEach(s=>s.classList.remove('done'));
    loading.style.display='block';
    const totalMs=3000;
    const stepMs=[totalMs*0.2,totalMs*0.45,totalMs*0.75,totalMs*0.95];
    let start=null;
    function frame(ts) {
        if(!start)start=ts;
        const elapsed=ts-start;
        const pct=Math.min(elapsed/totalMs*100,100);
        bf.style.width=pct+'%';
        bp.textContent=Math.round(pct)+'%';
        stepMs.forEach((threshold,i)=> {
            if(elapsed>=threshold)steps[i].classList.add('done');
        }
        );
        if(elapsed<totalMs)requestAnimationFrame(frame);
        else done();
    }
    requestAnimationFrame(frame);
    function done() {
        loading.style.display='none';
        btn.disabled=false;
        btn.style.opacity='1';
        const amount=parseInt(q);
        totalGlobal+=amount;
        sessaoCount+=amount;
        localStorage.setItem('totalGlobal',totalGlobal);
        animateCounter(document.getElementById('statTotal'),totalGlobal);
        animateCounter(document.getElementById('statSessao'),sessaoCount);
        document.getElementById('popupSub').textContent=amount.toLocaleString('pt-BR')+' denúncias enviadas com sucesso';
        document.getElementById('overlay').classList.add('active');
        document.getElementById('popup').classList.add('active');
    }
}
function closePopup() {
    document.getElementById('overlay').classList.remove('active');
    document.getElementById('popup').classList.remove('active');
}
document.addEventListener('keydown',e=> {
    if(e.key==='Enter') {
        if(document.getElementById('loginPage').style.display!=='none')logar();
        else enviar();
    }
    if(e.key==='Escape')closePopup();
}
