<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel IPTV StreamBR</title>
    <!-- Tailwind CSS v4 via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: #06070a;
            color: #ecf0f1;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .neon-shadow {
            box-shadow: 0 0 20px rgba(0, 239, 255, 0.15);
        }
        /* Customização da Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #06070a;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f2937;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00eff5;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Cabeçalho Principal e Barra de Busca -->
    <header class="max-w-7xl mx-auto mb-10 flex flex-col md:flex-row items-center justify-between gap-6 bg-zinc-950/40 p-6 rounded-2xl border border-zinc-900/80 backdrop-blur-md">
        <h1 class="text-3xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500">
            STREAM<span class="text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.3)]">BR</span>
        </h1>
        
        <div class="w-full md:w-112 flex gap-2 relative">
            <input type="text" id="search-input" placeholder="Buscar filme ou série dublada..." 
                   class="w-full px-5 py-3 rounded-xl bg-zinc-900/90 border border-zinc-800 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all text-sm placeholder-zinc-500">
            <button onclick="searchContent()" class="px-6 py-3 bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 text-white font-bold rounded-xl text-sm transition-all duration-300 shadow-lg shadow-cyan-500/10 active:scale-95">
                Buscar
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto">
        <!-- Container do Player Dinâmico e Protegido -->
        <section id="player-container" class="hidden mb-12 bg-zinc-950/80 backdrop-blur-xl rounded-2xl overflow-hidden p-4 border border-cyan-500/20 neon-shadow transition-all duration-500">
            <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 mb-4 pb-4 border-b border-zinc-900">
                <div class="flex flex-col gap-1">
                    <span id="player-type" class="text-xs font-semibold text-purple-400 uppercase tracking-widest">Cinema</span>
                    <h2 id="player-title" class="text-xl font-bold text-cyan-400 tracking-wide">Reproduzindo</h2>
                </div>
                
                <!-- Seleção Alternativa de Servidores Dublados e Atualizados -->
                <div class="flex flex-wrap gap-2 bg-zinc-900/90 p-1.5 rounded-xl border border-zinc-800">
                    <button id="btn-srv1" onclick="changeServer('servidor1')" class="px-4 py-2 text-xs font-bold rounded-lg bg-cyan-500 text-black transition-all duration-250 shadow-md">
                        🔥 Servidor 1 (Dublado)
                    </button>
                    <button id="btn-srv2" onclick="changeServer('servidor2')" class="px-4 py-2 text-xs font-bold rounded-lg text-zinc-400 hover:text-white transition-all duration-250">
                        🚀 Servidor 2 (Dublado)
                    </button>
                    <button id="btn-srv3" onclick="changeServer('servidor3')" class="px-4 py-2 text-xs font-bold rounded-lg text-zinc-400 hover:text-white transition-all duration-250">
                        ⚡ Servidor 3 (Global)
                    </button>
                </div>

                <button onclick="closePlayer()" class="text-zinc-400 hover:text-white font-semibold text-xs bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 px-4 py-2.5 rounded-xl transition-all active:scale-95">
                    ✕ Fechar Player
                </button>
            </div>

            <!-- Seletor de Episódios (Apenas para Séries) -->
            <div id="series-selector" class="hidden mb-4 bg-zinc-900/50 p-4 rounded-xl border border-zinc-800/80">
                <div class="flex flex-wrap gap-4 items-center">
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1 font-bold uppercase">Temporada</label>
                        <select id="season-select" onchange="onSeasonChange()" class="bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-cyan-500"></select>
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs text-zinc-400 mb-1 font-bold uppercase">Episódio</label>
                        <div id="episodes-grid" class="flex flex-wrap gap-2 mt-1"></div>
                    </div>
                </div>
            </div>
            
            <!-- Player de Vídeo Proporção 16:9 -->
            <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden shadow-2xl border border-zinc-900">
                <!-- BLINDAGEM MÁXIMA ANTI-ADS: Sem allow-popups e sem allow-top-navigation -->
                <iframe id="video-iframe" src="" class="absolute top-0 left-0 w-full h-full border-0" 
                        allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
            </div>
        </section>

        <!-- Grade de Catálogos -->
        <div class="flex items-center justify-between mb-6">
            <h2 id="section-heading" class="text-xl font-black tracking-wider uppercase flex items-center gap-2">
                <span class="w-2.5 h-6 bg-gradient-to-b from-cyan-400 to-purple-600 rounded-full"></span> Filmes e Séries em Alta (PT-BR)
            </h2>
            <button id="back-catalog-btn" onclick="resetCatalog()" class="hidden text-xs font-bold text-cyan-400 hover:underline">
                ← Voltar aos Destaques
            </button>
        </div>
        
        <div id="catalog-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6"></div>
    </main>

    <script>
        // Chave do TMDB para metadados e capas
        const TMDB_API_KEY = '8af7366b5b5c960a5e8401309e3e7f4b'; 
        const TMDB_BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';

        // APIs atualizadas com servidores nacionais funcionais (Dublados)
        const SERVIDORES_FILME = {
            servidor1: "https://embed.superflixapi.top/filme/",
            servidor2: "https://embed.warezcdn.com/filme/",
            servidor3: "https://vidsrc.icu/embed/movie/"
        };

        const SERVIDORES_SERIE = {
            servidor1: "https://embed.superflixapi.top/serie/", // Formato: id/temp/ep
            servidor2: "https://embed.warezcdn.com/serie/",     // Formato: id/temp/ep
            servidor3: "https://vidsrc.icu/embed/tv/"          // Formato: id/temp/ep
        };

        let itemAtual = null; // Guarda o objeto completo do filme/série selecionado
        let tipoAtual = 'movie'; // 'movie' ou 'tv'
        let servidorAtual = "servidor1";
        let temporadaAtual = 1;
        let episodioAtual = 1;

        document.addEventListener('DOMContentLoaded', () => {
            loadTrending();
        });

        // Carrega misturado o que está em alta (Filmes e Séries)
        async function loadTrending() {
            try {
                const response = await fetch(`${TMDB_BASE_URL}/trending/all/week?api_key=${TMDB_API_KEY}&language=pt-BR`);
                const data = await response.json();
                renderCatalog(data.results);
            } catch (error) {
                console.error("Erro ao buscar tendências:", error);
            }
        }

        function renderCatalog(items) {
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = '';

            if(!items || items.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-zinc-500 py-12">Nenhum título encontrado.</div>';
                return;
            }

            items.forEach(item => {
                // Ignora se não for filme ou série, ou se não tiver capa
                if ((item.media_type && item.media_type !== 'movie' && item.media_type !== 'tv') || !item.poster_path) return;
                
                const tipo = item.media_type || (item.title ? 'movie' : 'tv');
                const titulo = item.title || item.name;

                const card = document.createElement('div');
                card.className = 'group cursor-pointer bg-zinc-950/60 rounded-xl overflow-hidden hover:scale-105 transition-all duration-300 relative border border-zinc-900 hover:border-cyan-500/40 shadow-md';
                card.onclick = () => startStream(item, tipo);

                card.innerHTML = `
                    <div class="relative aspect-[2/3] w-full overflow-hidden">
                        <img src="${IMG_URL + item.poster_path}" alt="${titulo}" class="w-full h-full object-cover group-hover:opacity-60 transition-all duration-300">
                    </div>
                    <div class="p-3 absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black via-black/95 to-transparent pt-8">
                        <p class="text-xs font-bold text-zinc-200 truncate group-hover:text-cyan-400 transition-colors">${titulo}</p>
                        <div class="flex items-center justify-between mt-1">
                            <span class="text-[10px] text-zinc-400 font-medium">⭐ ${item.vote_average ? item.vote_average.toFixed(1) : '0.0'}</span>
                            <span class="text-[9px] bg-cyan-950 text-cyan-400 px-1.5 py-0.5 rounded font-bold uppercase tracking-wider">${tipo === 'movie' ? 'Filme' : 'Série'}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function searchContent() {
            const query = document.getElementById('search-input').value;
            if (query.trim() === '') return;
            
            document.getElementById('section-heading').innerHTML = `<span class="w-2.5 h-6 bg-gradient-to-b from-cyan-400 to-purple-600 rounded-full"></span> Resultados para: ${query}`;
            document.getElementById('back-catalog-btn').classList.remove('hidden');
            
            try {
                // Busca multi-conteúdo (traz filmes e séries juntos)
                const response = await fetch(`${TMDB_BASE_URL}/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}&language=pt-BR`);
                const data = await response.json();
                renderCatalog(data.results);
            } catch (error) {
                console.error("Erro na busca:", error);
            }
        }

        function resetCatalog() {
            document.getElementById('search-input').value = '';
            document.getElementById('section-heading').innerHTML = `<span class="w-2.5 h-6 bg-gradient-to-b from-cyan-400 to-purple-600 rounded-full"></span> Filmes e Séries em Alta (PT-BR)`;
            document.getElementById('back-catalog-btn').classList.add('hidden');
            loadTrending();
        }

        async function startStream(item, tipo) {
            itemAtual = item;
            tipoAtual = tipo;
            temporadaAtual = 1;
            episodioAtual = 1;

            const title = item.title || item.name;
            document.getElementById('player-container').classList.remove('hidden');
            document.getElementById('player-title').innerText = title;
            document.getElementById('player-type').innerText = tipo === 'movie' ? '🎬 Filme Dublado' : '📺 Série Dublada';
            
            if (tipo === 'tv') {
                document.getElementById('series-selector').classList.remove('hidden');
                await loadSeriesDetails(item.id);
            } else {
                document.getElementById('series-selector').classList.add('hidden');
                updatePlayerSource();
            }
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Puxa as temporadas e episódios reais da série via TMDB
        async function loadSeriesDetails(seriesId) {
            try {
                const response = await fetch(`${TMDB_BASE_URL}/tv/${seriesId}?api_key=${TMDB_API_KEY}&language=pt-BR`);
                const data = await response.json();
                
                const seasonSelect = document.getElementById('season-select');
                seasonSelect.innerHTML = '';
                
                // Filtra apenas temporadas reais (ignora especiais/temporada 0 se preferir)
                const seasons = data.seasons.filter(s => s.season_number > 0);
                if(seasons.length === 0 && data.seasons.length > 0) {
                    seasons.push(data.seasons[0]); // fallback se só tiver temp 0
                }

                seasons.forEach(season => {
                    const opt = document.createElement('option');
                    opt.value = season.season_number;
                    opt.innerText = season.name || `Temporada ${season.season_number}`;
                    seasonSelect.appendChild(opt);
                });

                if(seasons.length > 0) {
                    temporadaAtual = seasons[0].season_number;
                    await loadEpisodes(seriesId, temporadaAtual);
                }
            } catch (error) {
                console.error("Erro ao buscar detalhes da série:", error);
            }
        }

        async function loadEpisodes(seriesId, seasonNumber) {
            try {
                const response = await fetch(`${TMDB_BASE_URL}/tv/${seriesId}/season/${seasonNumber}?api_key=${TMDB_API_KEY}&language=pt-BR`);
                const data = await response.json();
                
                const epGrid = document.getElementById('episodes-grid');
                epGrid.innerHTML = '';

                data.episodes.forEach(ep => {
                    const btn = document.createElement('button');
                    btn.id = `ep-btn-${ep.episode_number}`;
                    btn.className = `px-3 py-1.5 text-xs font-bold rounded-md border ${ep.episode_number === episodioAtual ? 'bg-purple-600 text-white border-purple-500' : 'bg-zinc-950 text-zinc-400 border-zinc-800 hover:text-white'}`;
                    btn.innerText = `EP ${ep.episode_number}`;
                    btn.onclick = () => selectEpisode(ep.episode_number);
                    epGrid.appendChild(btn);
                });

                updatePlayerSource();
            } catch (error) {
                console.error("Erro ao buscar episódios:", error);
            }
        }

        function onSeasonChange() {
            temporadaAtual = document.getElementById('season-select').value;
            episodioAtual = 1;
            loadEpisodes(itemAtual.id, temporadaAtual);
        }

        function selectEpisode(epNumber) {
            // Remove destaque do ep antigo
            const oldBtn = document.getElementById(`ep-btn-${episodioAtual}`);
            if(oldBtn) oldBtn.className = "px-3 py-1.5 text-xs font-bold rounded-md border bg-zinc-950 text-zinc-400 border-zinc-800 hover:text-white";
            
            episodioAtual = epNumber;
            
            // Adiciona destaque no novo ep
            const newBtn = document.getElementById(`ep-btn-${episodioAtual}`);
            if(newBtn) newBtn.className = "px-3 py-1.5 text-xs font-bold rounded-md border bg-purple-600 text-white border-purple-500";
            
            updatePlayerSource();
        }

        function updatePlayerSource() {
            const iframe = document.getElementById('video-iframe');
            if (!itemAtual) return;

            if (tipoAtual === 'movie') {
                iframe.src = `${SERVIDORES_FILME[servidorAtual]}${itemAtual.id}`;
            } else {
                // Passa o ID, a temporada e o episódio formatados para a URL de séries nacional
                iframe.src = `${SERVIDORES_SERIE[servidorAtual]}${itemAtual.id}/${temporadaAtual}/${episodioAtual}`;
            }
        }

        function changeServer(serverKey) {
            servidorAtual = serverKey;
            
            ['servidor1', 'servidor2', 'servidor3'].forEach((key, idx) => {
                const btn = document.getElementById(`btn-srv${idx+1}`);
                if(key === serverKey) {
                    btn.className = "px-4 py-2 text-xs font-bold rounded-lg bg-cyan-500 text-black transition-all duration-250 shadow-md";
                } else {
                    btn.className = "px-4 py-2 text-xs font-bold rounded-lg text-zinc-400 hover:text-white transition-all duration-250";
                }
            });

            updatePlayerSource();
        }

        function closePlayer() {
            itemAtual = null;
            document.getElementById('video-iframe').src = '';
            document.getElementById('player-container').classList.add('hidden');
            document.getElementById('series-selector').classList.add('hidden');
        }
        
        document.getElementById('search-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') searchContent();
        });
    </script>
</body>
</html>
